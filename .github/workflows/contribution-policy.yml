name: contribution-policy

# Metadata only. NEVER check out, import, install, or run PR/fork code here.
# Keep this on the trusted default branch. See docs/REPOSITORY-SETUP.md.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to recheck
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: contribution-proof-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: false

jobs:
  metadata:
    name: Trusted contribution metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Check proof and publish status on the actual PR head
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: python -I scripts/contribution_gate.py --live
