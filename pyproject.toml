[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-stratigraphy-test"
version = "0.2.0"
description = "Harness-independent knowledge experiments with auditable telemetry"
requires-python = ">=3.10"
dependencies = ["jsonschema>=4.23,<5"]

[project.optional-dependencies]
test = ["pytest>=8.3,<10", "pytest-cov>=6,<8"]

[project.scripts]
kst = "kst.cli:main"

[tool.setuptools.packages.find]
include = ["kst*"]

[tool.setuptools.package-data]
kst = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "unit: pure functions and component behavior",
  "behavior: end-to-end user-visible scenarios",
  "contract: adapter and serialization conformance",
]

[tool.coverage.run]
branch = true
source = ["kst"]

[tool.coverage.report]
show_missing = true
fail_under = 90
exclude_also = ["if __name__ == .__main__.:", "class .*\\bProtocol\\):", "@abstractmethod"]
